<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101a1a" />
    <meta name="description" content="《劍影江湖》立體江湖戰棋，以及隨遊戲資料即時更新的圖鑑《江湖志》。" />
    <title>劍影江湖</title>
    <link rel="icon" type="image/svg+xml" href="game/assets/seal.svg" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #0d1618;
        --paper: #f3ecdd;
        --soft: #b9c2b6;
        --line: #33474a;
        --seal: #9c4835;
        --gold: #dab778;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          linear-gradient(rgba(13, 22, 24, 0.82), rgba(13, 22, 24, 0.94)),
          url('wiki/assets/jianghu-cover.webp') center / cover no-repeat,
          var(--ink);
        color: var(--paper);
        font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
      }
      main {
        width: min(760px, 100%);
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: clamp(40px, 9vw, 68px);
        letter-spacing: 0.12em;
        font-weight: 800;
      }
      p.lead {
        margin: 0 0 30px;
        color: var(--soft);
        font-size: 17px;
        line-height: 1.8;
      }
      nav {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      a.door {
        display: block;
        padding: 22px 24px 24px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(20, 33, 35, 0.86);
        color: inherit;
        text-decoration: none;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      a.door:hover,
      a.door:focus-visible {
        border-color: var(--gold);
        transform: translateY(-2px);
        outline: none;
      }
      a.door small {
        color: var(--gold);
        letter-spacing: 0.2em;
        font-size: 13px;
      }
      a.door strong {
        display: block;
        margin: 6px 0 8px;
        font-size: 28px;
        letter-spacing: 0.08em;
      }
      a.door span {
        color: var(--soft);
        font-size: 15px;
        line-height: 1.75;
      }
      a.door.play {
        border-color: var(--seal);
      }
      @media (prefers-reduced-motion: reduce) {
        a.door {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="game/assets/seal.svg" width="44" height="48" alt="" />
        <h1>劍影江湖</h1>
      </header>
      <p class="lead">十關立體江湖戰棋。抽三位俠客同行，拜習武學、入鋪整裝，闖過銅漏中的十重江湖。</p>
      <nav aria-label="入口">
        <a class="door play" href="game/">
          <small>遊戲</small>
          <strong>十漏迷津</strong>
          <span>進入遊戲。進度自動保存在這個瀏覽器裡。</span>
        </a>
        <a class="door" href="wiki/">
          <small>圖鑑</small>
          <strong>江湖志</strong>
          <span>世界觀設定、群俠、武學、器物、任務與十渡輿圖。內容隨遊戲資料即時更新。</span>
        </a>
      </nav>
    </main>
  </body>
</html>
